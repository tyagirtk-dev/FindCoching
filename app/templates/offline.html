{% extends "base.html" %}
{% block title %}You're offline — {{ site_name }}{% endblock %}
{% block content %}
<div class="empty-state">
  <div class="empty-state-icon"><i class="bi bi-wifi-off"></i></div>
  <h5 class="mt-3 mb-1">You're offline</h5>
  <p class="text-muted small mb-3">Check your internet connection and try again. Pages you've already visited may still be available.</p>
  <button class="btn btn-primary" onclick="window.location.reload()">
    <i class="bi bi-arrow-clockwise"></i> Retry
  </button>
</div>
{% endblock %}
