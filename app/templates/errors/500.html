{% extends "base.html" %}
{% block title %}Server Error — {{ site_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
  <h2 class="mt-3">500 — Something Went Wrong</h2>
  <p class="text-muted">An unexpected error occurred. Our team has been notified.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
