{% extends "base.html" %}
{% block title %}Commission Settings — {{ site_name }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 500px;">
  <h4 class="mb-3">Commission Settings</h4>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Commission Percentage (%)</label>
      <input type="number" step="0.1" min="0" max="100" name="commission_percent" class="form-control" value="{{ commission_percent }}">
      <div class="form-text">Percentage deducted from each payment before crediting the teacher wallet.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save</button>
  </form>
</div>
{% endblock %}
