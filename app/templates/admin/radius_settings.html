{% extends "base.html" %}
{% block title %}Radius Settings — {{ site_name }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width: 500px;">
  <h4 class="mb-3">Search Radius Settings</h4>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Default Search Radius (KM)</label>
      <input type="number" step="0.1" min="0.5" name="radius_km" class="form-control" value="{{ radius_km }}">
      <div class="form-text">Students will only see teachers within this radius by default.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Save</button>
  </form>
</div>
{% endblock %}
